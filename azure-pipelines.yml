trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  keyvault: 'myvault12345'
  secretname: 'dbpass'

steps:

- task: AzureKeyVault@2
  displayName: 'Fetch Secret from Azure Key Vault'
  inputs:
    azureSubscription: 'keyvaultconnection'
    KeyVaultName: '$(keyvault)'
    SecretsFilter: '$(secretname)'
    RunAsPreJob: false
  name: FetchSecrets

- bash: |
    echo "Secret fetched successfully"
    echo "##vso[task.setvariable variable=dbPassword;issecret=true]$(dbpass)"
  displayName: 'Set Secret Variable'

- bash: |
    echo "Database deployment started"
    # Use $(dbPassword) in deployment commands
  displayName: 'Deploy Application'